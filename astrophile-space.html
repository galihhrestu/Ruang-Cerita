<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#07101f"
    >

    <title>Astrophile’s Space — Ruang Cerita</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="astrophile-space.css">
</head>


<body>

    <main
        id="astrophileExperience"
        class="astrophile-experience"
    >

        <canvas
            id="astrophileExperienceCanvas"
            class="astrophile-experience-canvas"
            aria-hidden="true"
        ></canvas>


        <div
            class="astrophile-experience-grain"
            aria-hidden="true"
        ></div>


        <div
            class="astrophile-experience-vignette"
            aria-hidden="true"
        ></div>


        <header class="astrophile-experience-topbar">

            <a
                href="index.html"
                class="astrophile-back"
            >
                <span>←</span>
                <span>Ruang Cerita</span>
            </a>


            <div class="astrophile-experience-brand">

                <small>
                    A SKY FOR HER
                </small>

                <strong>
                    Astrophile’s Space
                </strong>

            </div>


            <div class="astrophile-phase-indicator">

                <span id="astrophilePhaseName">
                    Full Moon
                </span>

                <i></i>

                <small id="astrophileSkyState">
                    MOONLIT NIGHT
                </small>

            </div>

        </header>


        <section class="astrophile-experience-copy">

            <p>
                ✦ FOR THE ONE WHO ALWAYS LOOKS UP
            </p>

            <h1>
                The Night
                <span>Above Us.</span>
            </h1>

            <em>
                Under the same sky, always.
            </em>

        </section>


        <div
            class="astrophile-interaction-hint"
            aria-hidden="true"
        >
            <span>
                TAP THE SKY
            </span>

            <i></i>

            <small>
                make a wish ✦
            </small>
        </div>


        <div
            class="astrophile-bottom-signature"
            aria-hidden="true"
        >

            <span>
                G × W
            </span>

            <i></i>

            <small>
                A PRIVATE NIGHT EXPERIENCE
            </small>

        </div>

    </main>


    <script src="astrophile-space.js"></script>

</body>

</html>
